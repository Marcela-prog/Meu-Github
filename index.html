<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">

            <!-- IMAGEM DO PERFIL -->
            <img class="profile-avatar" id="avatar" src="" alt="Foto do Github">

            <!-- NOME -->
            <h1 class="profile-name" id="nome"></h1>

            <!-- USERNAME -->
            <h2 class="profile-username" id="username"></h2>

            <ul class="numbers">

                <!-- REPOSITÓRIOS -->
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repositorios"></span>
                </li>

                <!-- SEGUIDORES -->
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="seguidores"></span>
                </li>

                <!-- SEGUINDO -->
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="seguindo"></span>
                </li>

            </ul>

            <!-- GITHUB -->
            <a id="linkGithub" href="#" class="profile-link">Ver no Github</a>

        </div>
    </header>

    <script src="script.js"></script>
</body>
</html>
