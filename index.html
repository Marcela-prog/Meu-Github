<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Perfil do GitHub de Marcela Nogueira" />
    <title>Meu GitHub</title>

    <link rel="stylesheet" href="main.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <form class="search" id="formBusca">
        <label for="campoUsuario" class="sr-only">Usuário do GitHub</label>
        <input
          type="text"
          id="campoUsuario"
          placeholder="Digite um usuário do GitHub"
          autocomplete="off"
          required
        />
        <button type="submit">Buscar</button>
      </form>
    </header>

    <main class="container profile">
      <img class="profile-avatar" id="avatar" alt="" width="180" height="180" />

      <h1 class="profile-name" id="nome">Carregando...</h1>
      <p class="profile-username" id="username"></p>

      <dl class="numbers">
        <div class="numbers-item">
          <dt>Repositórios</dt>
          <dd id="repositorios">-</dd>
        </div>
        <div class="numbers-item">
          <dt>Seguidores</dt>
          <dd id="seguidores">-</dd>
        </div>
        <div class="numbers-item">
          <dt>Seguindo</dt>
          <dd id="seguindo">-</dd>
        </div>
      </dl>

      <a
        class="profile-link"
        id="linkGithub"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Ver no GitHub
      </a>
    </main>
  </body>
</html>
